#   ### 1. 진입 패턴 (Entry Patterns):
#   - 눌림목에서 탈출 신호가 있을 때 매수하라.
#   - 바닥권에서 반전 신호가 있을 때 매수하라.
#   - MACD가 감소에서 증가로 확실히 반전할 때 진입하라.  
#   - 제세금 및 수수료를 고려하여 순수익이 예상될 때만 진입하라.
#   - 곧 저항선에 막혀 다시 하락할 가능성이 보인다면 진입하지 마라.
  
#   ### 2. 매도 패턴 (Exit Patterns):
#   - 손실은 작게, 수익은 키워라.
#   - 지지선이 무너지면 망설이지 말고 매도하라.
#   - MACD가 증가에서 감소로 확실히 반전하면 매도하라.

# analysis_principles: |
#   ### 1. 진입 패턴 (Entry Patterns) - [빠르고 선제적인 타점 확보]:
#   - [반등 초입 선제 진입]: 1분봉이 볼린저 밴드 하단선 부근에서 지지받으며 첫 양봉이 출현하거나, RSI가 과매도 구간(30 이하)을 탈출하면 진입하라.
#   - [MACD 둔화 포착]: MACD 히스토그램의 감소세가 둔화(색상 옅어짐 또는 기울기 감소)되기 시작하거나 골든크로스 징후가 보이면 진입하라.
#   - [추세 눌림목 매수]: 5분봉이 상승 추세면서, 1분봉 또는 3분봉의 눌림목에서 반등이 있을 때 진입하라.
#   - [호가창/체결강도 가속도 활용]: 체결강도가 100% 미만이더라도 차트상 반등 징후가 명확하면 과감하게 진입하라.
#   - [기대 수익 룸 확보]: 기대 상승 폭(가장 가까운 저항선이나 전고점까지)이 제세금 및 수수료를 초과할 수 있다면 진입하라.
  
#   ### 2. 매도 패턴 (Exit Patterns) - [추세 극대화 및 조기 청산 방지]:
#   - [최소 보유 호흡 유지]: 파괴적인 급락 신호가 없는 한, 진입 후 **최소 5분봉 2~3개가 완성될 때까지는** 조기 청산을 피하고 추세를 지켜보라.
#   - [상승 추세 홀딩 극대화]: 수익 구간(현재가 > 진입가)에서는 추세가 우상향하는 한, 1분봉의 일시적인 이평선(EMA 20) 이탈만으로 매도하지 마라.
#   - [정교한 익절 조건] 아래 조건 중 확실한 추세 꺾임이 확인될 때만 익절하라:
#     * 1분봉 RSI가 70 이상의 과매수 구간에 도달한 후 명확히 꺾일 때
#     * 5분봉의 캔들 고점이 명확하게 하락하거나 긴 윗꼬리를 달기 시작할 때
#     * 호가 매수 잔량비율이 30% 이하로 급감하여 수급이 완전히 무너질 때
#   - [손절은 완성봉 기준]: 진입가 대비 하락 중일 때, 미세한 꼬리 이탈(휩쏘)에 속지 말고, **완성봉(종가) 기준**으로 지지선이 확실히 깨지거나 음봉 몸통이 강하게 하향 돌파될 때만 손절하라.

