# # 수수료 보전
# analysis_principles: |
#   ## 1. 전략적 이원화 (Two-Way Entry)
#   - **[전략 A: 추세 추종]** 5분봉 상승 중, 1분봉과 3분봉 눌림목에서 BUY.
#   - **[전략 B: 역추세 매수]** 5분봉 하락 또는 횡보 중, 1분봉이 볼린저 밴드 하단선 부근에서 지지받거나 RSI 30 이하에서 탈출하는 반등 '초입'에 BUY. 
#   - **[우선순위]** 볼린저 밴드 하단에서의 빠른 반등 초입 선점을 위해 '전략 B'의 신호 포착에 높은 가중치를 두어 판단하라.

#   ## 2. 제세금 및 수수료 필터 (진입 장벽) - 최우선 적용
#   - **[진입 전 손익비 계산]:** BUY 신호가 포착되더라도, '진입 예상가'에서 '가장 가까운 기술적 저항선(볼린저 상단 또는 이전 고점)'까지의 기대 상승 폭이 **[수수료 + 제세금]**보다 작다면 진입을 원천 보류(HOLD)하라.
#   - 수수료를 내고도 확실히 남는 '먹을 폭(룸)'이 나오는 자리에서만 과감하게 BUY를 실행하라. 진입 횟수를 줄이고 타율을 높이는 것이 최우선이다.

#   ## 3. 매도 규칙 (Post-Entry Price Action)
#   진입 후에는 수수료를 이기는 확실한 파동을 먹는 것이 단타의 핵심이다. 가격 방향에 따라 아래 알고리즘을 엄격히 적용하라.

#   ### A. 진입 후 가격이 [상승 중]일 때 (current > entry)
#   1. **[수수료 장벽 체크]:** 수익이 **수수료와 제세금 **을 초과하기 전까지는** 아래의 익절 신호(a~d)가 발생하더라도 청산하지 말고 **HOLD**하라.
#   2. **[익절 실행 조건]:** 아래 조건 중 **'하나라도'** 감지되면 즉시 SELL(익절)하여 수익을 확정하라.
#     - (a) 1분봉이 볼린저 밴드 상단선을 터치한 후, 연속으로 음봉이 출현하며 꺾일 때 (상단 이탈 및 음봉 전환)
#     - (b) 1분봉 RSI가 70 이상에 도달한 후 꺾이거나, 70 미만이더라도 고점이 낮아지는 쌍봉(M패턴)을 만들 때
#     - (c) 3분봉 또는 5분봉의 캔들 고점이 이전 캔들보다 낮아지거나 긴 윗꼬리를 달기 시작할 때
#     - (d) 상승 흐름인데 매수 잔량비율이 60% 이상으로 급증하며 상방 저항을 돌파하지 못할 때 ('설거지 패턴'으로 간주)
#   3. **[수익 보존 조건]:** 위 익절 신호가 없어도, 수수료와 제세금을 초과한 수익이 있다면 달성한 후 가격이 밀려 1분봉 볼린저 중심선(또는 EMA 20)을 하향 이탈하려 하면 수익 보존을 위해 선제적으로 SELL하라.

#   ### B. 진입 후 가격이 [하락 중]일 때 (current < entry)
#   - **[허수 지지벽 붕괴 시 즉시 손절]:** 호가창에 매수 잔량이 매도 잔량보다 훨씬 많음에도(매수 잔량비율 60% 이상) 지지선이 힘없이 깨질 때는 트랩이므로 즉시 SELL(손절)하라.
#   - **[기술적 이탈 시 종가 기준 손절]:** 1분봉 EMA 20(또는 볼린저 중심선)을 이탈할 때는, 캔들 꼬리로 살짝 건드리는 미세한 이탈(휩쏘)에는 흔들리지 말고 HOLD하되, **'완성봉(종가)' 기준**으로 확실하게 이탈하거나 음봉의 크기가 볼린저 밴드 폭의 20% 이상으로 강하게 하향 돌파할 때만 SELL(손절)하라.

#   ## 4. 타임프레임의 역할 분담 (Context vs Trigger)
#   - 5분봉과 3분봉은 '시장의 배경(Context) 및 추세 둔화 확인' 용도이다.
#   - 1분봉은 '최종 실행 트리거(Trigger)'이다. 진입 타이밍은 3분봉의 완벽한 추세 전환을 기다리지 말고, 1분봉의 볼린저 밴드 하단 반등 신호(양봉 전환 등)에 맞춰 즉각 실행하라.

#   ## 5. 데이터 교차 검증 (Cross-Verification)
#   - 차트 지표와 호가창 수급이 '동시에' 완벽할 필요는 없다. 차트 지표(볼린저 하단 반등)가 선행하고, 호가창은 보조 필터로만 활용한다.
#   - **[선제적 진입 허용]:** 1분봉이 볼린저 밴드 하단에서 양봉을 만들며 턴어라운드할 때는, 체결강도가 100% 미만이거나 호가창이 완벽하지 않더라도 '진입 기회'로 간주하여 과감하게 BUY하라. (체결강도 폭발을 기다리면 늦는다.)
#   - **[가짜 상승(트랩) 신호]:** 차트상 돌파처럼 보이나, 호가창 하단에만 매수 잔량이 비정상적으로 두껍게 깔려 있고(매수 잔량비율 65% 이상) 체결강도가 정체되어 있다면 진입 보류.

#   ## 6. 최소 보유 호흡 (Minimum Holding Breath)
#   - 규칙 3에서 정의한 명확한 익절/손절 신호가 발생하지 않는 한, BUY 진입 후 **최소 1분봉 2~3개가 완성될 때까지는** 포지션을 유지하며 추세를 관찰하라. 1분봉 하나의 미세한 등락(노이즈)에 일희일비하여 조기 청산하지 말라.

#   ## 7. 손실 후 재진입 제한 (Loss-Recovery Discipline)
#   - [최근 매도 정보]에 '손실' 기록이 있고 5분 이내라면:
#     - 반드시 '거래량 2배 증가 + MACD 골든크로스'가 충족되거나, 1분봉 볼린저 밴드 하단에서 명확한 이중바닥(W패턴) 신호가 나올 때만 재진입하라. 조건이 불명확하면 HOLD.
#   - 5분 경과 후: 손실 제한을 해제하고 정상 규칙에 따라 판단하라.

#   ## 8. 종목 보유 정보의 제공
#   - 종목의 보유 현황을 고려해 정교한 '매수/매도 전략'을 수립한다. 차트의 기술적 신호가 파괴되었다면, 매수가와 관계없이 냉정하게 SELL을 결정하라.

# # 3분봉 기준
# analysis_principles: |
  1. 전략적 이원화 (Two-Way Entry):
    - [전략 A: 추세 추종] 5분봉이 확실한 상승 추세(정배열 또는 이평선 상방)일 때, 3분봉의 눌림목(볼린저 중심선 또는 EMA 20 지지)에서 BUY.
    - [전략 B: 역추세 매수] 5분봉이 하락 후 횡보하거나 단기 과매도 구간일 때, 3분봉이 볼린저 밴드 하단선 부근에서 지지받거나 RSI 30 이하에서 탈출하는 반등 '초입'에 BUY.
    - [우선순위] 거래 횟수를 압축하고 확실한 타점을 잡기 위해, 5분봉의 추세가 받쳐주는 전략 A를 기본으로 하되, 낙주 매매 시에만 전략 B를 적용한다.

  2. 매도 규칙 — 진입 후 가격 방향 기준 (Post-Entry Price Action):
    - 진입 후 가격이 상승 중이라면 (current > entry):
      * 3분봉 기준의 파동을 끝까지 먹는 것을 목표로 하되, 아래 조건 중 하나라도 감지되면 즉시 SELL(익절)하라:
        (a) 3분봉이 볼린저 밴드 상단선을 터치한 후, 연속 음봉이 출현하며 꺾일 때
        (b) 3분봉 RSI가 70 이상에 도달한 후 꺾이거나, 고점이 낮아지는 쌍봉(M패턴)을 만들 때
        (c) 5분봉의 캔들 고점이 이전 캔들보다 명확히 낮아지거나 긴 윗꼬리를 달 때
        (d) 상승 흐름인데 매수 잔량비율이 65% 이상으로 급증하며 상방 저항을 돌파하지 못할 때 ('설거지 패턴')

      * 위 신호 전까지는 홀딩하되, 3분봉 볼린저 중심선(또는 EMA 20)을 종가로 하향 이탈하면 수익 보존을 위해 선제적으로 SELL하라.
    - 진입 후 가격이 하락 중이라면 (current < entry):
      * 호가창에 허수 지지벽이 깔리거나(매수 잔량비율 60% 이상), 3분봉 볼린저 하단선이 종가로 완전히 깨질 때 → 즉시 SELL(손절).
      * 3분봉 매매는 1분봉보다 손절 폭이 깊어질 수 있으므로, 기술적 이탈 전이라도 진입가 대비 -2% 도달 시 조건 없이 시장가 손절한다.

  3. 타임프레임의 역할 분담 (Context vs Trigger):
    - 5분봉: 시장의 배경(Context) 및 큰 추세의 방향성을 확인하는 용도. (5분봉이 역배열 폭포수일 때는 매수 금지)
    - 3분봉: 최종 실행 트리거(Trigger). 진입과 탈출의 모든 기준은 3분봉의 캔들 완성(종가) 또는 완성 직전의 확실한 형태를 기준으로 즉각 실행한다.

  4. 데이터 교차 검증 및 진입 보류 (Cross-Verification):
    - 3분봉이 볼린저 하단에서 양봉을 만들며 돌아설 때는 체결강도가 다소 부족하더라도 과감하게 진입한다. (3분봉 양봉 전환은 1분봉 세 개가 상승했다는 뜻이므로 신뢰도가 높음)
    - 단, 차트상 반등처럼 보이나 호가창 하단에만 매수 잔량이 비정상적으로 두껍고 체결강도가 정체되어 있다면 가짜 반등(트랩)으로 간주하여 진입을 보류한다.

  5. 손실 후 재진입 제한 (Loss-Recovery Discipline):
    - [최근 매도 정보]에 '손실' 기록이 있고 10분 이내라면 (3분봉 기준이므로 시간을 늘림):
      * 반드시 거래량 증가 + MACD 골든크로스가 충족되거나, 3분봉 볼린저 하단에서 명확한 이중바닥(W패턴)이 나올 때만 재진입하라. 그렇지 않으면 HOLD.