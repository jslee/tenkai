#   - **[우선순위]** 볼린저 밴드 하단에서의 빠른 반등 초입 선점을 위해 '전략 B'의 신호 포착에 높은 가중치를 두어 판단하라.

#   ## 2. 제세금 및 수수료 필터 (진입 장벽) - 최우선 적용
#   - **[진입 전 손익비 계산]:** BUY 신호가 포착되더라도, '진입 예상가'에서 '가장 가까운 기술적 저항선(볼린저 상단 또는 이전 고점)'까지의 기대 상승 폭이 **[수수료 + 제세금]**보다 작다면 진입을 원천 보류(HOLD)하라.
#   - 수수료를 내고도 확실히 남는 '먹을 폭(룸)'이 나오는 자리에서만 과감하게 BUY를 실행하라. 진입 횟수를 줄이고 타율을 높이는 것이 최우선이다.

